name: Plugin ingestion verification
on:
  pull_request:
    branches: [dev, main, 'feat/runtime-*']
  push:
    branches: [dev, feat/ruoyi-5.6-plugin-ingestion, backup/trace-release-recovery-20261108]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: plugin-ingestion-${{ github.ref }}
  cancel-in-progress: false
jobs:
  components:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned TypeScript checker
        run: npm install --global typescript@5.8.3
      - name: Install pinned isolated Vue contract test tools
        run: npm install --prefix "$RUNNER_TEMP/fcp-vue-contracts" --no-save --package-lock=false vue@3.5.30 vue-router@5.0.3 vite@7.3.2 typescript@5.9.3 vue-tsc@3.3.14 jsdom@26.0.0
      - name: Actual Vue business uncertainty boundary
        run: FCP_VUE_ROOT="$RUNNER_TEMP/fcp-vue-contracts/node_modules" bash tests/plugin-business-ui/run.sh
      - name: Actual release console confirmation component
        run: FCP_VUE_TOOLS="$RUNNER_TEMP/fcp-vue-contracts/node_modules" node --experimental-strip-types --test tests/frontend-release/containment-sfc.test.mjs tests/frontend-release/observation-safety-sfc.test.mjs
      - name: Archive exact source before tests
        run: mkdir -p evidence && git archive --format=zip --output=evidence/source.zip HEAD && git rev-parse HEAD > evidence/commit.txt
      - name: Trace context, bounded logging and actual cross-language verification
        run: python3 tools/verify_observability.py
      - name: Retain same-runner HTTP trace overhead evidence
        if: github.event_name == 'pull_request'
        env:
          BASELINE_COMMIT: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/measure_trace_overhead.py --baseline-ref "$BASELINE_COMMIT"
      - name: System version and release component verification
        run: python3 tools/verify_system_release.py
      - name: Runtime contract and package verification
        run: python3 tools/verify_runtime_contracts.py
      - name: Runtime lifecycle and real HTTP verification
        run: python3 tools/verify_runtime_lifecycle.py
      - name: Shared host semantics and plugin dependency boundary
        run: python3 tools/verify_runtime_portability.py
      - name: Runtime storage boundary verification
        run: python3 tools/verify_runtime_storage.py
      - name: Runtime exchange process verification
        run: bash tests/runtime-exchange/run.sh
      - name: Actual process crash recovery matrix
        run: bash tests/runtime-crash/run.sh
      - name: Existing component regressions
        run: python3 tools/verify_components.py
      - name: Existing legacy regressions
        run: python3 tools/verify_legacy.py
      - name: Ingestion regressions when present
        run: |
          if [ -f tools/verify_ingestion.py ]; then python3 tools/verify_ingestion.py; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-ingestion-evidence
          path: |
            evidence/source.zip
            evidence/commit.txt
            reports/observability/
            reports/system-release/
            reports/runtime-contracts/
            reports/runtime-lifecycle/
            reports/runtime-storage/
            reports/runtime-crash/
            reports/runtime-portability/
            reports/runtime-versions/
            reports/components.json
            reports/legacy-regressions.json
            reports/ingestion.json
          retention-days: 7
